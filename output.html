<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Output</title>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    .empty {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #18212f;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .empty-box {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 45px rgba(26, 32, 44, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="empty">
    <div class="empty-box">
      <h1>출력할 HTML이 없습니다</h1>
      <p>먼저 에디터에서 HTML을 입력한 뒤 출력 버튼을 눌러주세요.</p>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "html-live-preview-code";
    const html = localStorage.getItem(STORAGE_KEY);

    if (html && html.trim()) {
      window.setTimeout(() => {
        document.open();
        document.write(html);
        document.close();
      }, 0);
    }
  </script>
</body>
</html>
